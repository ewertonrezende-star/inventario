name: Publicar Inventário Coopsintra no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Executar testes
        run: bun run test
      - name: Construir aplicação SPA
        run: bun run build
        env:
          BASE_PATH: /inventario/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Validar e preparar ficheiros do Pages
        run: |
          if [ -f .output/public/_shell.html ]; then
            PAGES_DIR=.output/public
            cp "$PAGES_DIR/_shell.html" "$PAGES_DIR/index.html"
            cp "$PAGES_DIR/_shell.html" "$PAGES_DIR/404.html"
          elif [ -f .output/public/index.html ]; then
            PAGES_DIR=.output/public
            cp "$PAGES_DIR/index.html" "$PAGES_DIR/404.html"
          elif [ -f dist/client/index.html ]; then
            PAGES_DIR=dist/client
            cp "$PAGES_DIR/index.html" "$PAGES_DIR/404.html"
          elif [ -f dist/index.html ]; then
            PAGES_DIR=dist
            cp "$PAGES_DIR/index.html" "$PAGES_DIR/404.html"
          else
            echo "Não foi encontrado o shell SPA ou index.html. O build não está preparado para GitHub Pages."
            find .output dist -maxdepth 4 -name '*.html' -print 2>/dev/null || true
            exit 1
          fi
          if ! grep -qi "<script" "$PAGES_DIR/index.html"; then
            echo "O HTML publicado não contém os scripts da aplicação."
            sed -n "1,100p" "$PAGES_DIR/index.html"
            exit 1
          fi
          touch "$PAGES_DIR/.nojekyll"
          echo "PAGES_DIR=$PAGES_DIR" >> "$GITHUB_ENV"
          echo "A publicar a pasta: $PAGES_DIR"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
