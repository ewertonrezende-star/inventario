name: Publicar Inventário Coopsintra no GitHub Pages
# Publicação exclusiva por GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Construir aplicação estática
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Localizar e validar ficheiros publicados
        run: |
          if [ -f dist/client/index.html ]; then PAGES_DIR=dist/client;
          elif [ -f .output/public/index.html ]; then PAGES_DIR=.output/public;
          elif [ -f dist/index.html ]; then PAGES_DIR=dist;
          else echo "Não foi encontrado o index.html gerado pelo build."; find . -maxdepth 4 -name index.html -print; exit 1; fi
          if grep -q "Inventário – Scan" "$PAGES_DIR/index.html"; then echo "Foi detetado o HTML antigo na publicação."; exit 1; fi
          if ! grep -qi "<script" "$PAGES_DIR/index.html" || ! grep -q "assets/" "$PAGES_DIR/index.html"; then echo "O HTML publicado não contém os scripts da aplicação; a publicação foi cancelada para evitar página em branco."; sed -n "1,100p" "$PAGES_DIR/index.html"; exit 1; fi
          echo "PAGES_DIR=$PAGES_DIR" >> "$GITHUB_ENV"
          touch "$PAGES_DIR/.nojekyll"
          echo "A publicar a pasta: $PAGES_DIR"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
